<div class="page__footer-line">
  <span>&copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}</span>
  {% if site.author.github %}
    <span aria-hidden="true">&middot;</span>
    <a href="https://github.com/{{ site.author.github }}" rel="me"><i class="fab fa-github" aria-hidden="true"></i> GitHub</a>
  {% endif %}
  <span aria-hidden="true">&middot;</span>
  <a href="{{ '/sitemap/' | relative_url }}">{{ site.data.ui-text[site.locale].site_map | default: "Sitemap" }}</a>
  <span aria-hidden="true">&middot;</span>
  <span>Built with <a href="https://jekyllrb.com" rel="nofollow">Jekyll</a> &amp; <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a></span>
</div>
